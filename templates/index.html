<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Chatbot</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a1f;
      --border: #2a2a32;
      --text: #e8e8ed;
      --text-muted: #8888a0;
      --accent: #6c5ce7;
      --accent-hover: #5b4cdb;
      --user-msg: #2d2d38;
      --bot-msg: #252530;
      --radius: 12px;
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }
    header {
      text-align: center;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--text);
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .chat-container {
      width: 100%;
      max-width: 620px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 75vh;
      min-height: 480px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      scroll-behavior: smooth;
    }
    .message {
      max-width: 85%;
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: var(--bot-msg);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .message .role-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.75;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }
    .input-area {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      background: rgba(26, 26, 31, 0.95);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .input-row {
      display: flex;
      gap: 0.65rem;
    }
    #message-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      min-height: 46px;
      max-height: 140px;
      line-height: 1.4;
      transition: border-color 0.2s ease;
    }
    #message-input::placeholder { color: var(--text-muted); }
    #message-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    #send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 1.35rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s ease, opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    #temperature {
      width: 110px;
      height: 6px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    #temperature-value {
      min-width: 2.5ch;
      font-weight: 500;
      color: var(--text);
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .status-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-text.error { color: #f87171; font-weight: 500; }
    .status-text.ok { color: #4ade80; }
    .typing {
      opacity: 0.8;
      font-style: italic;
    }
    .dot-flashing {
      display: inline-block;
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>{{ title | default('LLM Chatbot') }}</h1>
    <p class="subtitle">{{ (provider | default('Ollama')) | capitalize }} ({{ model | default('Local') }}) · Bounded Multi-Turn Memory</p>
  </header>

  <main class="chat-container">
    <div id="chat-messages" role="log" aria-live="polite"></div>

    <div class="input-area">
      <div class="input-row">
        <textarea
          id="message-input"
          placeholder="Ask a question or enter a prompt... (Shift+Enter for newline)"
          rows="1"
          aria-label="Chat input"
        ></textarea>
        <button id="send-btn" type="button" aria-label="Send message">Send</button>
      </div>
      <div class="controls">
        <label for="temperature">
          Temperature:
          <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
          <span id="temperature-value">0.7</span>
        </label>
        <button id="clear-btn" type="button" style="background: none; border: none; color: var(--text-muted); font-size: 0.75rem; cursor: pointer; text-decoration: underline;">Clear chat</button>
      </div>
      <div class="status-bar">
        <div id="status" class="status-text">Checking backend status...</div>
      </div>
    </div>
  </main>

  <script>
    const messagesEl = document.getElementById('chat-messages');
    const inputEl = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');
    const tempSlider = document.getElementById('temperature');
    const tempValue = document.getElementById('temperature-value');
    const statusEl = document.getElementById('status');

    // In-memory conversation history kept for client synchronization
    let conversationHistory = [];

    function setStatus(text, type = 'normal') {
      statusEl.textContent = text;
      statusEl.className = 'status-text' + (type === 'error' ? ' error' : type === 'ok' ? ' ok' : '');
    }

    // Safely append a message to chat window using standard DOM text nodes (no XSS risk)
    function appendMessage(role, content) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + (role === 'user' ? 'user' : 'assistant');

      const label = document.createElement('div');
      label.className = 'role-label';
      label.textContent = role === 'user' ? 'You' : 'Assistant';
      msgDiv.appendChild(label);

      const textDiv = document.createElement('div');
      textDiv.textContent = content;
      msgDiv.appendChild(textDiv);

      messagesEl.appendChild(msgDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Toggle typing indicator
    function showTyping(show) {
      let el = document.getElementById('typing-indicator');
      if (show) {
        if (!el) {
          el = document.createElement('div');
          el.id = 'typing-indicator';
          el.className = 'message assistant typing';

          const label = document.createElement('div');
          label.className = 'role-label';
          label.textContent = 'Assistant';
          el.appendChild(label);

          const text = document.createElement('div');
          text.className = 'dot-flashing';
          text.textContent = 'Thinking...';
          el.appendChild(text);

          messagesEl.appendChild(el);
        }
        el.style.display = 'block';
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } else if (el) {
        el.style.display = 'none';
      }
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      inputEl.value = '';
      sendBtn.disabled = true;
      appendMessage('user', message);
      showTyping(true);
      setStatus('Generating response...');

      const temperature = parseFloat(tempSlider.value);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message,
            temperature: temperature,
            history: conversationHistory,
            session_id: 'default'
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || data.message || ('Server error: HTTP ' + res.status));
        }

        conversationHistory = data.history || [];
        showTyping(false);
        appendMessage('assistant', data.reply);
        setStatus(`Provider: ${data.provider} | Model: ${data.model_used}`, 'ok');
      } catch (err) {
        showTyping(false);
        setStatus(`Error: ${err.message}`, 'error');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    clearBtn.addEventListener('click', () => {
      conversationHistory = [];
      messagesEl.innerHTML = '';
      setStatus('Conversation cleared.');
    });

    tempSlider.addEventListener('input', () => {
      tempValue.textContent = tempSlider.value;
    });

    // Initial Health Check on page load
    async function checkHealth() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        if (data.status === 'ok') {
          setStatus(`Backend Ready: ${data.provider} (${data.model})`, 'ok');
        } else {
          const detail = data.details?.error || data.status || 'degraded';
          setStatus(`Backend Degraded: ${data.provider} (${detail})`, 'error');
        }
      } catch (err) {
        setStatus('Could not reach backend server.', 'error');
      }
    }

    checkHealth();
    inputEl.focus();
  </script>
</body>
</html>
